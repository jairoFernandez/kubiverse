name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  # From https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Install Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - run: make game-import
      - run: make test
      - run: helm lint deploy/helm/kubiverse

  # A real bridge against a real cluster: kind with two nodes, the e2e test
  # (production guard, patches over the WebSocket, rollouts, diff, drain
  # with a PodDisruptionBudget, permissions, audit log).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - uses: helm/kind-action@v1
        with:
          cluster_name: kubiverse-e2e
          config: bridge/testdata/kind-e2e.yaml
      - name: e2e
        working-directory: bridge
        env:
          KUBIVERSE_E2E_CONTEXT: kind-kubiverse-e2e
        run: go test -tags e2e -run E2E -count=1 -v ./...

  # Single-file bridges with the web build embedded: run one, open http://127.0.0.1:8088.
  bridge:
    needs: game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: kubiverse-web
          path: bridge/webdist
      # Tags stamp their version (vX.Y.Z -> X.Y.Z): GET /api/version.
      - run: make bridge-all VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kubiverse-bridge
          path: bridge/bin/kubiverse-bridge-*
          if-no-files-found: error

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache export templates
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}
      - name: Install Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  godot.zip" | sha512sum -c -
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Install export templates
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "$TEMPLATES_SHA512  templates.tpz" | sha512sum -c -
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && unzip -q templates.tpz && mv templates/* "$dest/"
      # Tag vX.Y.Z -> the game's version (macOS/Windows metadata fall back to it).
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^config\/version=.*/config\/version=\"${GITHUB_REF_NAME#v}\"/" game/project.godot && grep '^config/version' game/project.godot
      - run: make web macos linux windows
      - uses: actions/upload-artifact@v4
        with:
          name: kubiverse-web
          path: build/web
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kubiverse-macos
          path: build/macos/Kubiverse.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kubiverse-linux
          path: build/linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kubiverse-windows
          path: build/windows
          if-no-files-found: error

  # Public demo on GitHub Pages (enable Pages with source "GitHub Actions").
  # It runs the simulated cluster; players with a local bridge connect to it
  # from the start screen (bridge started with --allow-origin <pages origin>).
  pages:
    if: github.ref == 'refs/heads/main'
    needs: [test, game]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kubiverse-web
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # Team mode image (deploy/helm): the bridge with the web build inside,
  # ghcr.io/<owner>/kubiverse-bridge:main, :X.Y.Z and :latest on tags.
  image:
    if: github.event_name != 'pull_request'
    needs: [test, game]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kubiverse-web
          path: bridge/webdist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kubiverse-bridge
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # macOS: signed with a Developer ID and notarized, when the certificate is
  # in the repository secrets (APPLE_CERT_P12 base64, APPLE_CERT_PASSWORD,
  # APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD). Without them the release
  # keeps the ad-hoc signed app.
  sign-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bridge, game]
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{kubiverse-macos,kubiverse-bridge}"
      - name: Sign and notarize
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          kc=$RUNNER_TEMP/sign.keychain-db; kp=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$kp" "$kc" && security set-keychain-settings -lut 3600 "$kc" && security unlock-keychain -p "$kp" "$kc"
          security import $RUNNER_TEMP/cert.p12 -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          notarize() { xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait; }
          # The game
          mkdir -p out app && ditto -x -k dist/kubiverse-macos/Kubiverse.zip app
          codesign --force --deep --options runtime --timestamp -s "$id" app/Kubiverse.app
          ditto -c -k --keepParent app/Kubiverse.app out/kubiverse-macos.zip
          notarize out/kubiverse-macos.zip
          xcrun stapler staple app/Kubiverse.app
          rm out/kubiverse-macos.zip && ditto -c -k --keepParent app/Kubiverse.app out/kubiverse-macos.zip
          # The bridge binaries (a zip to notarize; the binaries themselves are shipped)
          for b in dist/kubiverse-bridge/kubiverse-bridge-darwin-*; do
            codesign --force --options runtime --timestamp -s "$id" "$b"; cp "$b" out/
          done
          ditto -c -k out/kubiverse-bridge-darwin-* bridges.zip && notarize bridges.zip
      - uses: actions/upload-artifact@v4
        if: env.HAS_CERT == 'true'
        with:
          name: signed-macos
          path: out/*

  # Tag vX.Y.Z -> GitHub Release with one archive per platform plus the bridge binaries.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, e2e, bridge, game, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      # By name: other jobs leave artifacts too (Docker build records).
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{kubiverse-*,signed-macos}"
      - name: Package
        run: |
          cd dist
          mkdir -p out
          cp kubiverse-macos/Kubiverse.zip out/kubiverse-macos.zip
          (cd kubiverse-web && zip -qr ../out/kubiverse-web.zip .)
          (cd kubiverse-linux && chmod +x kubiverse.x86_64 && tar czf ../out/kubiverse-linux-x86_64.tar.gz .)
          (cd kubiverse-windows && zip -qr ../out/kubiverse-windows-x86_64.zip .)
          chmod +x kubiverse-bridge/* && cp kubiverse-bridge/* out/
          # Signed and notarized macOS builds replace the ad-hoc ones when present.
          if [ -d signed-macos ]; then cp signed-macos/* out/; fi
      # Windows: Authenticode signature when WINDOWS_CERT_PFX (base64) and
      # WINDOWS_CERT_PASSWORD are in the secrets.
      - name: Sign Windows executables
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        if: env.HAS_WINDOWS_CERT == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq osslsigncode >/dev/null
          echo "$PFX" | base64 --decode > $RUNNER_TEMP/cert.pfx
          sign() { osslsigncode sign -pkcs12 $RUNNER_TEMP/cert.pfx -pass "$PFX_PASSWORD" -n Kubiverse -i https://github.com/${{ github.repository }} -t http://timestamp.digicert.com -in "$1" -out "$1.signed" && mv "$1.signed" "$1"; }
          for b in dist/out/kubiverse-bridge-windows-*.exe; do sign "$b"; done
          cd dist && rm -rf winsign && mkdir winsign && cd winsign && unzip -q ../out/kubiverse-windows-x86_64.zip
          for e in *.exe; do sign "$e"; done
          rm ../out/kubiverse-windows-x86_64.zip && zip -qr ../out/kubiverse-windows-x86_64.zip .
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Checksums, Homebrew and winget manifests
        run: |
          # The bridge used to be called k8s-bridge: its old asset names stay
          # for a couple of releases (old get-bridge scripts, old links).
          (cd dist/out && for f in kubiverse-bridge-*; do cp "$f" "k8s-bridge-${f#kubiverse-bridge-}"; done)
          (cd dist/out && sha256sum * > SHA256SUMS.txt)
          cd src && packaging/render.sh "${GITHUB_REF_NAME#v}" ../dist/out ../dist/packaging
          cp ../dist/packaging/* ../dist/out/
      # Homebrew tap (a repo jairoFernandez/homebrew-kubiverse), updated when
      # HOMEBREW_TAP_TOKEN (a token that can push there) is in the secrets.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.HAS_TAP_TOKEN == 'true'
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-kubiverse.git" tap
          mkdir -p tap/Formula tap/Casks
          cp dist/packaging/kubiverse-bridge.rb tap/Formula/ && cp dist/packaging/kubiverse.rb tap/Casks/
          # k8s-bridge was renamed: brew upgrade moves old installs.
          cp src/packaging/homebrew/formula_renames.json tap/
          rm -f tap/Formula/k8s-bridge.rb
          cd tap && git config user.name "kubiverse release" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "kubiverse ${GITHUB_REF_NAME}" && git push -q
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/out/* --repo "$GITHUB_REPOSITORY" --generate-notes
