# Sample workloads to make the KubeCraft world interesting.
#   kubectl apply -f deploy/demo.yaml
#   kubectl delete -f deploy/demo.yaml
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: v1
kind: Namespace
metadata: {name: payments}
---
apiVersion: v1
kind: Namespace
metadata: {name: monitoring}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: shop}
spec:
  replicas: 3
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: nginx:alpine
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: shop}
spec:
  selector: {app: frontend}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cart, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: cart}}
  template:
    metadata: {labels: {app: cart}}
    spec:
      containers:
        - name: cart
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do echo \"cart heartbeat $i\"; i=$((i+1)); sleep 3; done"]
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo 'sidecar ok'; sleep 10; done"]
---
apiVersion: v1
kind: Service
metadata: {name: cart, namespace: shop}
spec:
  selector: {app: cart}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: shop}
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: shop}
spec:
  clusterIP: None
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: payments}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          # Crashes after a few seconds: shows CrashLoopBackOff in game.
          command: ["sh", "-c", "echo 'ledger starting'; sleep 8; echo 'FATAL: db connection refused' >&2; exit 1"]
---
apiVersion: v1
kind: Service
metadata: {name: ledger, namespace: payments}
spec:
  type: NodePort
  selector: {app: ledger}
  ports: [{port: 9000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-ai, namespace: payments}
spec:
  replicas: 1
  selector: {matchLabels: {app: fraud-ai}}
  template:
    metadata: {labels: {app: fraud-ai}}
    spec:
      containers:
        - name: model
          # Image does not exist: shows ImagePullBackOff in game.
          image: registry.invalid/fraud-ai:v9
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-exporter, namespace: monitoring}
spec:
  selector: {matchLabels: {app: node-exporter}}
  template:
    metadata: {labels: {app: node-exporter}}
    spec:
      containers:
        - name: exporter
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"cpu=$((RANDOM % 100))\"; sleep 5; done"]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoring}
spec:
  type: LoadBalancer
  selector: {app: node-exporter}
  ports: [{port: 9100}]
