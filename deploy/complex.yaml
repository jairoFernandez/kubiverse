# A busier, more realistic scenario for a multi-node cluster (see
# deploy/kind-cluster.yaml). Every object is small (tiny requests, busybox /
# alpine images) so it runs on a laptop.
#   make scenario           kubectl apply -f deploy/complex.yaml
#   make scenario-delete
# What you'll see in KubeCraft:
#   ecommerce      web shop: spread frontend, api, workers, postgres+redis
#   data           3-broker StatefulSet, ETL CronJob (Completed pods), batch Job
#   ml             training on the tainted GPU node, a pod that can NEVER be
#                  scheduled (waits on the scheduler cloud), broken model image
#   observability  DaemonSet on every node (tolerates the GPU taint)
#   chaos          random crashes and an OOMKilled pod
---
apiVersion: v1
kind: Namespace
metadata: {name: ecommerce}
---
apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: v1
kind: Namespace
metadata: {name: ml}
---
apiVersion: v1
kind: Namespace
metadata: {name: observability}
---
apiVersion: v1
kind: Namespace
metadata: {name: chaos}
# ------------------------------------------------------------------ ecommerce
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: ecommerce}
spec:
  replicas: 4
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront, tier: web}}
    spec:
      # Spread replicas across nodes: you'll see robots on several islands.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: storefront}}
      containers:
        - name: nginx
          image: nginx:alpine
          resources: {requests: {cpu: 20m, memory: 16Mi}, limits: {memory: 64Mi}}
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: storefront, namespace: ecommerce}
spec:
  type: LoadBalancer
  selector: {app: storefront}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout-api, namespace: ecommerce}
spec:
  replicas: 3
  selector: {matchLabels: {app: checkout-api}}
  template:
    metadata: {labels: {app: checkout-api}}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date) POST /checkout 200 $((RANDOM % 90 + 10))ms\"; sleep 2; done"]
          resources: {requests: {cpu: 10m, memory: 8Mi}}
        - name: envoy
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo 'envoy: upstream healthy'; sleep 15; done"]
          resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: checkout-api, namespace: ecommerce}
spec:
  selector: {app: checkout-api}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-worker, namespace: ecommerce}
spec:
  replicas: 2
  selector: {matchLabels: {app: order-worker}}
  template:
    metadata: {labels: {app: order-worker}}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"processed order #$i\"; sleep 3; done"]
          resources: {requests: {cpu: 10m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: ecommerce}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      nodeSelector: {tier: data}
      containers:
        - name: postgres
          image: postgres:16-alpine
          env: [{name: POSTGRES_PASSWORD, value: kubecraft}]
          resources: {requests: {cpu: 50m, memory: 64Mi}}
          volumeMounts: [{name: pgdata, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: ecommerce}
spec:
  clusterIP: None
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: ecommerce}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: ecommerce}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
# ------------------------------------------------------------------------ data
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: broker, namespace: data}
spec:
  serviceName: broker
  replicas: 3
  selector: {matchLabels: {app: broker}}
  template:
    metadata: {labels: {app: broker}}
    spec:
      containers:
        - name: broker
          image: busybox:1.36
          command: ["sh", "-c", "echo \"broker $(hostname) joined the ring\"; while true; do echo 'partition leader heartbeat'; sleep 5; done"]
          resources: {requests: {cpu: 10m, memory: 8Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: broker, namespace: data}
spec:
  clusterIP: None
  selector: {app: broker}
  ports: [{port: 9092}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: etl-nightly, namespace: data}
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: busybox:1.36
              command: ["sh", "-c", "echo 'extract...'; sleep 5; echo 'transform...'; sleep 5; echo 'load: 1203 rows'"]
              resources: {requests: {cpu: 10m, memory: 8Mi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: reindex, namespace: data}
spec:
  completions: 3
  parallelism: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reindex
          image: busybox:1.36
          command: ["sh", "-c", "echo 'reindexing shard'; sleep 20; echo done"]
          resources: {requests: {cpu: 10m, memory: 8Mi}}
# -------------------------------------------------------------------------- ml
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trainer, namespace: ml}
spec:
  replicas: 2
  selector: {matchLabels: {app: trainer}}
  template:
    metadata: {labels: {app: trainer}}
    spec:
      # Only allowed (and forced) onto the tainted GPU island.
      nodeSelector: {accelerator: gpu}
      tolerations: [{key: gpu, operator: Equal, value: "true", effect: NoSchedule}]
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "e=0; while true; do e=$((e+1)); echo \"epoch $e loss=0.$((RANDOM % 900 + 100))\"; sleep 4; done"]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-server, namespace: ml}
spec:
  replicas: 1
  selector: {matchLabels: {app: model-server}}
  template:
    metadata: {labels: {app: model-server}}
    spec:
      containers:
        - name: model
          image: registry.invalid/model-server:v2   # does not exist -> ImagePullBackOff
---
apiVersion: v1
kind: Service
metadata: {name: model-server, namespace: ml}
spec:
  selector: {app: model-server}
  ports: [{port: 8501}]
---
apiVersion: v1
kind: Pod
metadata: {name: giant-experiment, namespace: ml}
spec:
  # Asks for more CPU than any node has: stays Pending on the scheduler cloud.
  containers:
    - name: huge
      image: busybox:1.36
      command: ["sleep", "infinity"]
      resources: {requests: {cpu: "64", memory: 1Gi}}
# --------------------------------------------------------------- observability
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: log-agent, namespace: observability}
spec:
  selector: {matchLabels: {app: log-agent}}
  template:
    metadata: {labels: {app: log-agent}}
    spec:
      tolerations: [{operator: Exists}]   # runs on every node, GPU and control-plane too
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"shipped $((RANDOM % 500)) log lines\"; sleep 6; done"]
          resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo 'scrape ok: 42 targets'; sleep 10; done"]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: observability}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090}]
# ----------------------------------------------------------------------- chaos
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: flaky, namespace: chaos}
spec:
  replicas: 3
  selector: {matchLabels: {app: flaky}}
  template:
    metadata: {labels: {app: flaky}}
    spec:
      containers:
        - name: flaky
          image: busybox:1.36
          # Lives a random 10-60 s, then crashes.
          command: ["sh", "-c", "t=$((RANDOM % 50 + 10)); echo \"up for ${t}s\"; sleep $t; echo 'panic: nil pointer' >&2; exit 2"]
          resources: {requests: {cpu: 5m, memory: 8Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: memory-hog, namespace: chaos}
spec:
  replicas: 1
  selector: {matchLabels: {app: memory-hog}}
  template:
    metadata: {labels: {app: memory-hog}}
    spec:
      containers:
        - name: hog
          image: busybox:1.36
          # Fills a tmpfs past its 32Mi limit -> OOMKilled.
          command: ["sh", "-c", "echo 'allocating...'; sleep 5; head -c 100m /dev/zero | tail > /dev/null"]
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 32Mi}}
# --------------------------------------------------------------- the Internet
# Domains for the "Internet city" of KubeCraft. kind has no Ingress
# controller, so their address stays pending, but the routes are shown.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: storefront, namespace: ecommerce}
spec:
  tls: [{hosts: [shop.kubecraft.local]}]
  rules:
    - host: shop.kubecraft.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: storefront, port: {number: 80}}}}
          - {path: /checkout, pathType: Prefix, backend: {service: {name: checkout-api, port: {number: 8080}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: models, namespace: ml}
spec:
  rules:
    - host: models.kubecraft.local   # its backend never gets ready: 503
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: model-server, port: {number: 8501}}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: metrics, namespace: observability}
spec:
  rules:
    - host: metrics.kubecraft.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: prometheus, port: {number: 9090}}}}
