# High-availability playground: 3 control-plane nodes (etcd quorum of 3,
# survives 1 failure) + 2 workers, with API audit logging on so KubeCraft's
# WATCHTOWER mode can show who is using the cluster.
#   make cluster-ha        make cluster-ha-delete
# Don't use directly: the Makefile replaces @AUDIT@ (host dir for the audit
# logs, read by the bridge) and @POLICY@ (deploy/audit-policy.yaml).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubecraft-ha
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: audit-log-path
          value: /var/log/kubernetes/audit/audit.log
        - name: audit-policy-file
          value: /etc/kubernetes/audit/policy.yaml
        - name: audit-log-maxsize
          value: "20"
        - name: audit-log-maxbackup
          value: "2"
      extraVolumes:
        - name: audit-policy
          hostPath: /etc/kubernetes/audit
          mountPath: /etc/kubernetes/audit
          readOnly: true
          pathType: DirectoryOrCreate
        - name: audit-logs
          hostPath: /var/log/kubernetes/audit
          mountPath: /var/log/kubernetes/audit
          pathType: DirectoryOrCreate
nodes:
  # One log directory per API server: they must not write the same file.
  - role: control-plane
    extraMounts:
      - {hostPath: "@POLICY@", containerPath: /etc/kubernetes/audit/policy.yaml, readOnly: true}
      - {hostPath: "@AUDIT@/cp1", containerPath: /var/log/kubernetes/audit}
  - role: control-plane
    extraMounts:
      - {hostPath: "@POLICY@", containerPath: /etc/kubernetes/audit/policy.yaml, readOnly: true}
      - {hostPath: "@AUDIT@/cp2", containerPath: /var/log/kubernetes/audit}
  - role: control-plane
    extraMounts:
      - {hostPath: "@POLICY@", containerPath: /etc/kubernetes/audit/policy.yaml, readOnly: true}
      - {hostPath: "@AUDIT@/cp3", containerPath: /var/log/kubernetes/audit}
  - role: worker
  - role: worker
