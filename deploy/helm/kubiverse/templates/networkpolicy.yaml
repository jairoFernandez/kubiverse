{{- if .Values.networkPolicy.enabled }}
# The bridge trusts the user header set by the login proxy: only the ingress
# controller may reach it, or anyone in the cluster could claim to be anyone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubiverse.name" . }}
  labels: {{- include "kubiverse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kubiverse.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - {port: 8088}
{{- end }}
