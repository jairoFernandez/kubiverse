apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubiverse.name" . }}
  labels: {{- include "kubiverse.labels" . | nindent 4 }}
---
# What the bridge SEES (everyone sees this): read-only, no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubiverse.name" . }}-read
  labels: {{- include "kubiverse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, services, endpoints, events, configmaps, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  # Common CRDs, shown when installed.
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
# How the bridge ACTS: as the signed-in person (their RBAC applies). This is
# why only the ingress controller may reach the pod (see the NetworkPolicy).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubiverse.name" . }}-impersonate
  labels: {{- include "kubiverse.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubiverse.name" . }}-read
  labels: {{- include "kubiverse.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kubiverse.name" . }}-read}
subjects:
  - {kind: ServiceAccount, name: {{ include "kubiverse.name" . }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubiverse.name" . }}-impersonate
  labels: {{- include "kubiverse.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kubiverse.name" . }}-impersonate}
subjects:
  - {kind: ServiceAccount, name: {{ include "kubiverse.name" . }}, namespace: {{ .Release.Namespace }}}
